[package]
name = "websocket-ccp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CCP server for WebSocket streams: listen in the background, query only the fields and summaries you need"

[dependencies]
ccp-mcp = { path = "../../crates/ccp-mcp" }
ccp-stream = { path = "../../crates/ccp-stream", features = ["ws"] }

[dev-dependencies]
ccp-proto = { path = "../../crates/ccp-proto" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
