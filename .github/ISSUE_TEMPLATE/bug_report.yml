name: Bug report
description: Something returns the wrong result, errors, or crashes
labels: [bug]
body:
  - type: dropdown
    id: server
    attributes:
      label: Server
      options: [mysql-ccp, postgres-ccp, sqlite-ccp, csv-ccp, redis-ccp, websocket-ccp, socketio-ccp, http-ccp, ccp (demo), protocol / shared crates, other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<server> --version`
    validations: { required: true }
  - type: input
    id: database
    attributes:
      label: Data source and version
      placeholder: PostgreSQL 16.4, Redis 7.4, a Socket.IO 4 server, an API … 
  - type: textarea
    id: query
    attributes:
      label: Query and result
      description: The CCP query you sent, what you got, and what you expected. Remove any private data.
      render: text
    validations: { required: true }
  - type: textarea
    id: schema
    attributes:
      label: Relevant table definitions
      description: Optional. `CREATE TABLE` statements or the `ccp_schema` output.
      render: sql
