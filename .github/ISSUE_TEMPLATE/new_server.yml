name: New server proposal
description: Propose a CCP server for another data source (database, cache, queue, feed, API, files, reports…)
labels: [new-server]
body:
  - type: input
    id: source
    attributes:
      label: Data source
      placeholder: MongoDB, Kafka, MQTT, a log file, a gRPC service …
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: How would it map onto CCP?
      description: What are the roots, the fields, and (if any) the relations? What would the conventional tool return that a model does not need?
    validations: { required: true }
  - type: dropdown
    id: contribute
    attributes:
      label: Will you build it?
      options: ["Yes, I will open a pull request", "I would like help", "No, I am only suggesting it"]
    validations: { required: true }
  - type: markdown
    attributes:
      value: See [Writing a CCP server](https://github.com/hacimertgokhan/ccp/blob/main/docs/writing-a-server.md).
