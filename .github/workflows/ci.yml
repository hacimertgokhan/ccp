name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  smoke:
    name: MCP smoke test (sqlite-ccp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sqlite-ccp
      - name: Handshake and query over MCP
        run: |
          sqlite3 /tmp/smoke.db "CREATE TABLE t(id INTEGER PRIMARY KEY, name TEXT); INSERT INTO t VALUES (1,'ok');"
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ccp_query","arguments":{"query":"t{name}"}}}' \
            | CCP_PATH=/tmp/smoke.db ./target/release/sqlite-ccp)
          echo "$out"
          echo "$out" | grep -F 't:[{name:\"ok\"}]'

  servers:
    name: end-to-end (redis, csv, http)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p redis-ccp -p csv-ccp
      - name: redis-ccp
        run: |
          sudo apt-get install -y redis-tools >/dev/null
          redis-cli hset user:1 name Mert email m@x.com >/dev/null
          out=$(printf '%s\n' 'hashes(match:"user:*"){_key name}' | ./target/release/redis-ccp --ccp)
          echo "$out"; echo "$out" | grep -F '{hashes:[{_key:"user:1",name:"Mert"}]}'
      - name: csv-ccp
        run: |
          printf 'region,total\nEU,10\nEU,5\nUS,7\n' > /tmp/s.csv
          out=$(printf '%s\n' 's(group:"region",order:"-sum_total"){region sum_total}' | CCP_PATH=/tmp/s.csv ./target/release/csv-ccp --ccp)
          echo "$out"; echo "$out" | grep -F '{s:[{region:"EU",sum_total:15},{region:"US",sum_total:7}]}'
